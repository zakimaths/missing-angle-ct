name: Propose an improvement
description: Suggest a method, dataset, accessibility or documentation improvement.
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete use case and what is currently difficult.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed behavior and verification
      description: Explain how the improvement could be tested. For datasets, include the public source, licence and scanner geometry.
    validations:
      required: true
