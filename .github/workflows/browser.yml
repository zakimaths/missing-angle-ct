name: Browser reconstruction workflow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci --prefix qa --ignore-scripts
      - run: qa/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix qa
