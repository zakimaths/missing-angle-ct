name: Build and publish student demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.9.17
      - run: uv sync --locked --no-editable
      - run: uv run --locked --no-editable ruff check src tests scripts app
      - run: uv run --locked --no-editable pytest
      - run: uv run --locked --no-editable python scripts/build_demo.py
      - run: uv run --locked --no-editable python scripts/verify_demo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
