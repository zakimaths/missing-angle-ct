name: Build and publish CT demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.9.17
      - run: uv sync --locked --no-editable
      - run: uv run --locked --no-editable ruff check src tests scripts app
      - run: uv run --locked --no-editable pytest
      - run: node --test tests/live_reconstruction.test.cjs
      - run: node scripts/benchmark_live.cjs --check
      - run: uv run --locked --no-editable python scripts/build_demo.py
      - run: uv run --locked --no-editable python scripts/verify_demo.py
      - run: npm ci --prefix qa --ignore-scripts
      - run: qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: npm run test:demo --prefix qa
      - run: CT_BROWSER=webkit npm run test:demo --prefix qa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
